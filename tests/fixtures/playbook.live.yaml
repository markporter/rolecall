- name: Live idempotency demo
  hosts: all
  tasks:
    - name: Write banner (fast eta template)
      module: copy
      args:
        dest: /tmp/rolecall-banner.txt
        content:
          template: |
            === <%= app_name %> on <%= hostname %> ===
            Listening on port <%= http_port %>
            Generated by RoleCall at runtime
          engine: eta
    - name: Write greeting (jinja template)
      module: copy
      args:
        dest: /tmp/rolecall-greeting.txt
        content:
          template: |
            Hello from {{ app_name }}, host={{ hostname }}, port={{ http_port }}
          engine: jinja
