name: release

# Tag-driven release pipeline. Push a `v*` tag to publish:
#
#   1. `ci`        — reuses the full CI workflow (3-OS test matrix + native builds
#                    + npm-tarball smoke) as a hard gate.
#   2. `binaries`  — builds one real, smoke-tested Bun-compiled binary per OS and
#                    uploads it as a workflow artifact.
#   3. `release`   — collects every binary, creates the GitHub Release with
#                    auto-generated notes, and attaches the binaries.
#   4. `npm`       — publishes the Node bundle to npm via Trusted Publishing
#                    (OIDC). There is no NPM_TOKEN secret in this pipeline and
#                    none should be created. Skips cleanly when the name is not
#                    on the registry yet (the first publish is manual) or when
#                    that version already exists (re-pushed tag).
#
# See .local/RELEASING.md (maintainer-local, gitignored) for the operator flow.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 0. Fail fast if the pushed tag does not match package.json ----------
  verify-tag:
    name: verify tag matches package.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare pushed tag with package.json version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          echo "tag=v$tag package.json=$pkg"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::tag v$tag does not match package.json version $pkg; bump package.json or retag"
            exit 1
          fi

  # ---- 1. Full CI as a reusable-workflow gate -------------------------------
  ci:
    needs: verify-tag
    uses: ./.github/workflows/ci.yml

  # ---- 2. Per-OS native binaries -------------------------------------------
  binaries:
    name: binary (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Host target per OS: compiled AND smoke-tested on the matching runner.
          - { os: ubuntu-latest,  target: linux-x64-musl }
          - { os: macos-latest,   target: darwin-arm64-musl }
          - { os: windows-latest, target: windows-x64 }
          # Cross-built distribution artifact (Bun fetches the remote runtime;
          # generated but not executed on the x64 host — see README).
          - { os: ubuntu-latest,  target: linux-arm64-musl }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary (${{ matrix.target }})
        run: node scripts/build-bin.mjs --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*
          if-no-files-found: error

  # ---- 3. GitHub Release with notes + attached binaries ---------------------
  release:
    name: create GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release + upload assets
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true

      - name: List release assets
        run: ls -l dist/bin

      - name: Create Release (auto notes + binaries)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/bin/*
          fail_on_unmatched_files: true

  # ---- 4. npm STAGED publish via Trusted Publishing (OIDC) ----------------
  #
  # No stored credential: GitHub signs an OIDC token from the job's
  # `id-token: write` permission and the npm CLI exchanges it for a short-lived
  # credential, because `release.yml` is registered as a trusted publisher for
  # `@rolecall/cli` with stage-only permission (see .local/RELEASING.md). The same
  # OIDC identity signs the provenance attestation, so `--provenance` is not needed.
  #
  # Staging is deliberate: the version lands in a staging area and stays
  # uninstallable until a maintainer approves it with 2FA
  # (`npm stage list @rolecall/cli` -> `npm stage approve <id> --otp ...`, or the
  # npmjs.com UI). A compromised workflow therefore cannot ship a release on its
  # own. Consequence: a re-run before approval re-stages the same version and
  # fails on the duplicate — approve or `npm stage reject` first.
  #
  # Preflight keeps two no-op releases green:
  #   * package not on the registry  -> first publish must be manual (2FA)
  #   * version already published    -> re-pushed tag / retried run
  npm-preflight:
    name: npm preflight
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if ! npm view "$name" version >/dev/null 2>&1; then
            echo "::notice::${name} is not on the registry yet — the first publish is manual (see .local/RELEASING.md)"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif npm view "${name}@${version}" version >/dev/null 2>&1; then
            echo "::notice::${name}@${version} is already published — nothing to stage"
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

  npm:
    name: npm stage
    needs: [ci, npm-preflight]
    if: needs.npm-preflight.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC: authenticates the publish and signs provenance
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Pin the npm 11.21 line rather than `npm@latest`: npm 12 (current latest)
      # needs Node ^22.22.2 || ^24.15.0 || >=26, so it is not safe on this runner
      # image. 11.21 clears both floors we need — trusted publishing (11.5.1) and
      # OIDC dist-tag management (11.21.0).
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@^11.21.0
          v="$(npm --version)"
          echo "npm $v"
          node -e 'const [a,b] = process.argv[1].split(".").map(Number); if (a < 11 || (a === 11 && b < 5)) { console.error(`npm ${process.argv[1]} is too old for trusted publishing (need >= 11.5.1)`); process.exit(1) }' "$v"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Node bundle (lib/cli.js) is built by `prepack` (npm run build:js),
      # which runs as part of the stage step and shells out to Bun.
      - name: Stage release on npm (OIDC trusted publishing)
        run: npm stage publish --access public
