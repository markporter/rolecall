name: release

# Tag-driven release pipeline. Push a `v*` tag to publish:
#
#   1. `ci`        — reuses the full CI workflow (3-OS test matrix + native builds
#                    + npm-tarball smoke) as a hard gate.
#   2. `binaries`  — builds one real, smoke-tested Bun-compiled binary per OS and
#                    uploads it as a workflow artifact.
#   3. `release`   — collects every binary, creates the GitHub Release with
#                    auto-generated notes, and attaches the binaries.
#   4. `npm`       — publishes the Node bundle to npm with signed provenance.
#                    Skips cleanly when the NPM_TOKEN secret is not configured
#                    (so a binaries-only release works with zero setup).
#
# See RELEASING.md for the operator flow and one-time npm setup.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---- 1. Full CI as a reusable-workflow gate -------------------------------
  ci:
    uses: ./.github/workflows/ci.yml

  # ---- 2. Per-OS native binaries -------------------------------------------
  binaries:
    name: binary (${{ matrix.target }})
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Host target per OS: compiled AND smoke-tested on the matching runner.
          - { os: ubuntu-latest,  target: linux-x64-musl }
          - { os: macos-latest,   target: darwin-arm64-musl }
          - { os: windows-latest, target: windows-x64 }
          # Cross-built distribution artifact (Bun fetches the remote runtime;
          # generated but not executed on the x64 host — see README).
          - { os: ubuntu-latest,  target: linux-arm64-musl }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binary (${{ matrix.target }})
        run: node scripts/build-bin.mjs --target ${{ matrix.target }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: dist/bin/*
          if-no-files-found: error

  # ---- 3. GitHub Release with notes + attached binaries ---------------------
  release:
    name: create GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write # create release + upload assets
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist/bin
          merge-multiple: true

      - name: List release assets
        run: ls -l dist/bin

      - name: Create Release (auto notes + binaries)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/bin/*
          fail_on_unmatched_files: true

  # ---- 4. npm publish (skips cleanly without NPM_TOKEN) ---------------------
  npm:
    name: npm publish
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC signed provenance
      contents: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ">=1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The Node bundle (lib/cli.js) is built by `prepack` (npm run build:js),
      # which runs automatically as part of `npm publish`.
      - name: Publish to npm (with provenance)
        if: env.NODE_AUTH_TOKEN != ''
        run: npm publish --provenance --access public

      - name: Skip notice (no NPM_TOKEN)
        if: env.NODE_AUTH_TOKEN == ''
        run: echo "NPM_TOKEN secret not configured — skipping npm publish (binaries-only release)."
